services:
    backend:
        build: .
        container_name: hospital-backend

        ports:
            - "5175:5175"

        env_file:
            - .env

        depends_on:
            - redis

        restart: unless-stopped

    redis:
        image: redis:8-alpine
        container_name: hospital-redis

        ports:
            - "6379:6379"

        restart: unless-stopped

        volumes:
            - redis-data:/data

volumes:
    redis-data:
